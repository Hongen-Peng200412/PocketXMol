# scripts/sample_docking.py生成完整测试候选, scripts/evaluate_docking.py按同一配置评价.
# 中心T1模型分别接收C0/C5给定中心; 两种条件都保留后续中心相关重新加噪.
model_name: B-C-T1-RA
# str, 本次T1训练保存的配置, 提供原模型、特征化和噪声参数.
train_config: /storage/penghongen/PocketXMol/training/B-C-T1-RA/train_config/B-C-T1-RA.yml
# str, 按最低原C5 val/loss选出的20800步best; 停止状态及路径已从checkpoint核对.
checkpoint: /storage/penghongen/PocketXMol/training/B-C-T1-RA/checkpoints/step=20800.ckpt
# str, 模型和OccurrenceDataset均使用RA联合受体图及共享口袋编码器.
receptor_branch: RA
# bool, True保留T1后续高斯后的s*(0-预测重原子质心); 首步仍为原纯高斯先验.
# s=1-level_dict['pos']为实际噪声强度; 中心模式的局部给定中心恒为0.
center_translation: true
dataset:
  # str, 原图、沉积坐标及标准受体资产根, 只读.
  root: /storage/penghongen/AdaLigand/Ori_Data
  # str, 已完成共同准备的共享对称排列和逐实例标签根.
  derived_root: /storage/penghongen/Adaligand_Build/Ori_Data/pocketxmol
  # str, 冻结实例清单、具体C5偏移、候选种子及测试视图根, 不重新生成.
  manifest_root: /storage/penghongen/PocketXMol/data
  knn: 32  # int, OccurrenceDataset构造受体图的近邻上限.
# list[str], 按C0、C5顺序独立生成; C5读取冻结偏移, 两种条件共用冻结候选种子.
protocols: [C0, C5]
split: test  # str, ALL完整446个实例; CAP10和HF10_TO5复用同一候选池.
# str, 本模型的独立采样根; 当前正式产物由采样器写入其test子目录.
output_root: /storage/penghongen/PocketXMol/sampling/B-C-T1-RA
batch_size: 50  # int, 同一实例的50个候选一次组批, 总预算仍为50.
num_candidates: 50  # int, 每实例每协议固定预算, 失败仍进入分母.
num_steps: 100  # int, 原sample_loop3的完整采样步数.
device: cuda  # str, 在已获准GPU中执行采样.
evaluation_workers: 8  # int, 后续evaluate_docking的CPU进程数, 提交时另明确申请8核.
# 仅评价阶段读取并上传汇总, 私密API key不进入配置.
wandb:
  entity: pencounkdual-111
  project: PocketXmol_raw
  name: B-C-T1-RA_test
  mode: online
