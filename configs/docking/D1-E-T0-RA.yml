# D1-E-T0-RA 的密度训练配置, scripts/train_pl.py 读取 model、loss、noise、transforms、data、train.
# 数据集从 model.density 派生唯一密度入口; 原 RA 图、dock 噪声、loss 与置信度保持既定契约.
# attention_backend 控制瓶颈和无距离全局读出的内核; 启用距离时全局读出使用 FP32 几何和 SDPA 数学内核.
# 以下加载进程、单卡批量、激活重算值是性能预实验起点, 最终资源配置按实际验收记录确定.
model:
  name: pm_asym_denoiser
  pocket_dim: 128
  node_dim: 320
  addition_node_features:
  - is_peptide
  add_output:
  - confidence
  edge_dim: 96
  pocket:
    edge_dim: 32
    hidden_dim: 128
    num_blocks: 4
    dist_cfg:
      num_gaussians: 32
  denoiser:
    hidden_dim: 320
    num_blocks: 6
    dist_cfg:
      stop: 15
      num_gaussians: 64
    gate_dim: 2
    context_cfg:
      edge_dim: 128
      knn: 32
      dist_cfg:
        stop: 20
        num_gaussians: 64
        type_: linear
  nucleic_branch: RA
  # 密度编码与读出, PMAsymDenoiser 构造 DensityEncoder 及六个独立 DensityReadout.
  density:
    mode: D1  # str, 三次下采样至 6³×256, 不构建第四次下采样或解码器.
    attention_backend: flash  # str, 瓶颈与无距离全局注意力强制使用 PyTorch Flash; 参考实现仅供数值验收.
    distance_bias: true  # bool, 逐头 softplus(beta) 乘以平方物理距离 / 100; 额外耗时是否符合约定在预实验中判定.
    checkpoint: true  # bool, 训练反向时重算重型块激活, 不保存跨更新的密度特征.
# 原 IndividualTasksLoss 及其置信度目标; 本配置不增加密度监督项.
loss:
  name: individual_tasks
  weights:
    node: 1.5
    pos: 2.5
    edge: 1.5
    dist: 0.0005
    dih: 0.0005
    fixed_node: 0.1
    fixed_pos: 0.1
    fixed_edge: 0.1
    fixed_dist: 0.0005
  tasks:
  - denovo
  - conf
  - sbdd
  - dock
  - maskfill
  - fbdd
  - pepdesign
  confidence:
    prob_1A: 0.2
    weights:
      node: 1
      pos: 20
      edge: 1
# 原 dock 高斯、同构重分配和固定字段恢复; C0/C5 不切换采样公式.
noise:
  name: mixed
  individual:
  - name: dock
    reassign_in: true
    prior:
      pos:
        name: allpos
        pos:
          name: gaussian_simple
          sigma_func: sqrt
          sigma_max: 1.0
        translation:
          name: translation
          ve: false
          mean: 0
          std: 1
        rotation:
          name: rotation
          sigma_max: 0.0002
        torsional:
          name: torsional
          sigma_max: 0.2
    level:
      name: uniform
      min: 0.0
      max: 1.0
transforms:
  featurizer:
    use_mask_node: true
    use_mask_edge: true
    chem:
      # int 列表, 顺序决定模型元素词表编号; 与原官方特征化配置一致.
      atomic_numbers:
      - 6
      - 7
      - 8
      - 9
      - 15
      - 16
      - 17
      - 5
      - 35
      - 53
      - 34
      # int 列表, 单键、双键、三键、芳香键类别; 保留原词表, 不表示本配置改变了实际输入编码.
      mol_bond_types:
      - 1
      - 2
      - 3
      - 4
  task:
    name: mixed
    individual:
    - name: dock
      settings:
        free: 1.0
      free_no_geometry: true
data:
  dataset:
    name: adaligand
    root: /storage/penghongen/AdaLigand/Ori_Data
    derived_root: /storage/penghongen/Adaligand_Build/Ori_Data/pocketxmol
    manifest_root: /storage/penghongen/PocketXMol/data
    pocket_mode: envelope  # str, 训练和 val/loss 使用真实配体包络 E, 原点为输入受体原子均值.
    knn: 32
train:
  seed: 2023
  batch_size: 24
  num_workers: 15
  pin_memory: true
  max_steps: 40000  # int, 优化器更新上限; 第三次学习率实际下降时可提前停止.
  val_check_interval: 800  # int, 每 800 次全局72实例的优化器更新计算原 val/loss.
  precision: bf16-mixed
  persistent_workers: true
  optimizer:
    type: adamw
    lr: 0.0001
    weight_decay: 0.001
    beta1: 0.99
    beta2: 0.999
    eps: 1.0e-08
  scheduler:
    warmup_step: 0
    instance:
      type: plateau
      mode: min
      threshold_mode: rel
      threshold: 0.01  # float, 原 val/loss 相对改善阈值 1%, 与 best 按最低原损失保存的规则区分.
      patience: 5  # int, 连续第6次未达到改善阈值时降低学习率.
      factor: 0.2
      cooldown: 0
      min_lr: 0
      eps: 1.0e-08
  global_batch_size: 72  # int, 单卡批量×梯度累积×GPU数, 本阶段每模型一张GPU.
  accumulate_grad_batches: 3
  log_every_n_steps: 50
  initial_checkpoint: /storage/penghongen/PocketXMol_official_test/extracted/data/trained_models/pxm/checkpoints/pocketxmol.ckpt
  wandb:
    entity: pencounkdual-111
    project: PocketXmol_density
    name: D1-E-T0-RA
    mode: online
