# flexible 小分子 docking 的 use 配置；scripts/sample_use.py::main 读取并与模型 YAML 合并。
# 候选预算由 scripts/sample_use.py::main 读取，并用于 UseDataset、DataLoader 和轨迹抽样。
sample:
  seed: 2024  # int；统一随机种子。
  batch_size: 50  # int；每批候选图数。
  num_mols: 100  # int；该单复合物最多保存的 pose 数。
  save_traj_prob: 0.05  # float，[0,1]；逐候选轨迹落盘概率。

# scripts/sample_use.py::main 把本组传给 get_input_data；后者调用 process.utils_process.extract_pocket/get_input_from_file。
data:
  protein_path: data/examples/dock/8C7Y_TXV_protein.pdb  # str；受体蛋白 PDB。
  # str；提供内部构象与二维图的起始小分子 SDF。
  input_ligand: data/examples/dock/8C7Y_TXV_ligand_start_conf.sdf  # mol sdf file
  # input_ligand: CC(C)(C#N)c1cccc(C(=O)Nc2ccc(F)c(C(=O)c3c[nH]c4ncc(Cl)cc34)c2F)c1  # can also be SMILES
  is_pep: False  # bool；明确使用小分子 RDKit 路径，排除肽 docking。
  pocket_args:
    pocket_coord: [-8.2570, 85.1810, 19.0500]  # list[float] 长度 3，Å；蛋白原始系裁剪中心。
    radius: 15  # float，Å；口袋原子裁剪半径。
    # You can also use a reference ligand (smaller radius since mol is larger than a point)
    # ref_ligand_path: data/examples/dock/8C7Y_TXV_ligand.sdf  # for extracting pocket
    # radius: 10
  pocmol_args:
    data_id: dock_8C7Y_TXV  # str；示例复合物唯一标识。
    pdbid: 8C7Y  # str；PDB 元数据标识。

# scripts/sample_use.py::main 用本组覆盖训练 transforms；featurizer_pocket 由 utils.transforms.FeaturizePocket 读取。
transforms:
  featurizer_pocket:
    center: [-8.2570, 85.1810, 19.0500]  # list[float] 长度 3，Å；去噪局部坐标原点。


# scripts/sample_use.py::main 把 transform 子树交给 utils.transforms.get_transforms；name=dock 实例化 ConfTransform。
# flexible docking：内部只沿可旋转键变化，整体以刚体位姿进入口袋。

task:
  name: dock  # str；图级 docking 标签。
  transform:
    name: dock  # str；创建 docking prompt、扭转键和域注释。
    settings:
      free: 0  # int 权重；禁用逐原子任意移动。
      flexible: 1  # int 权重；固定选择 translation+rotation+torsion 结构化模式。

# scripts/sample_use.py::main 把本组交给 utils.sample_noise.get_sample_noiser；name=dock 实例化 DockSamplNoiser。
noise:
  name: dock  # str；选择 DockSamplNoiser。
  num_steps: 100  # int；去噪与几何投影迭代次数。
  prior: from_train  # str 特殊值；复用训练配置 dock prior 的 trans/rot/tor 参数。
  level:
    name: advance  # str；AdvanceScaler 信息等级调度。
    min: 0.  # float；完全采用结构化运动 prior 的低信息端。
    max: 1.  # float；完全保留当前 pose 的高信息端。
    step2level:
      scale_start: 0.99999  # float；高保留端 sigmoid 参考值。
      scale_end: 0.00001  # float；低保留端 sigmoid 参考值。
      width: 3  # float；调度过渡宽度。
